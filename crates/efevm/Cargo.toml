[package]
name = "efevm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Register-based bytecode VM for efescript (roadmap E1)"

[lib]
path = "src/lib.rs"

[dependencies]
# Header checksum of `.efvm` modules (SPEC.md 9). Pure Rust, wasm-clean.
crc32fast = "1.5.5"

[dev-dependencies]
# `EFEVM_TEST_BACKEND=jit cargo test -p efevm` runs the integration tests on the JIT
# (tests/common/mod.rs). A dev-dependency cycle: efevm-jit depends on efevm.
efevm-jit = { path = "../efevm-jit" }
