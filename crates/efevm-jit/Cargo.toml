[package]
name = "efevm-jit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cranelift JIT backend for efevm (roadmap E7)"

[lib]
path = "src/lib.rs"

[dependencies]
efevm = { path = "../efevm" }

# Native only: nothing below is built for wasm32 (the crate body is empty there).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = "=0.137.2"
cranelift-frontend = "=0.137.2"
cranelift-jit = "=0.137.2"
cranelift-module = "=0.137.2"
cranelift-native = "=0.137.2"

[dev-dependencies]
efescript = { path = "../efescript" }
efa = { path = "../efa" }
