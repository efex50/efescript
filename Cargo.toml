[workspace]
resolver = "3"
members = [
    "crates/efescript",
    "crates/efescript/proc_macros",
    "crates/efescript/strtohx",
    "crates/calc",
    "crates/efevm",
    "crates/efa",
    "crates/efemod",
]

[profile.optimize]
inherits = "release"
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
